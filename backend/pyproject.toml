[project]
name = "cobol-analysis"
version = "0.1.0"
description = "COBOL legacy system analysis platform — agent pipeline + API + web console"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    "openpyxl>=3.1.5",
    "pyyaml>=6.0.2",
    "sse-starlette>=2.1.3",
    # agent stack
    "deepagents>=0.3",
    "langchain>=1.0",
    "langchain-core>=1.0",
    "langchain-openai>=1.0",
    "langgraph>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7", "mypy>=1.13"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
# Tests import `app.*`; setting pythonpath here means `python scripts/dev.py test` and a
# `pytest` invocation behave identically (no PYTHONPATH export required).
pythonpath = ["backend"]
filterwarnings = ["ignore::DeprecationWarning"]
